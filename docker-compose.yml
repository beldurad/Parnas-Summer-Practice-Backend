services:
  blockchain:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil"]
    command:
      - --host
      - 0.0.0.0
      - --chain-id
      - "31337"
      - --mnemonic
      - test test test test test test test test test test test junk
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD", "cast", "block-number", "--rpc-url", "http://127.0.0.1:8545"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: parnas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/parnas
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      PARNAS_BLOCKCHAIN_RPC_URL: http://blockchain:8545
      PARNAS_BLOCKCHAIN_CHAIN_ID: 31337
      PARNAS_BLOCKCHAIN_NETWORK: local
      PARNAS_BLOCKCHAIN_REQUIRED_CONFIRMATIONS: 1
      PARNAS_BLOCKCHAIN_DEPLOYER_PRIVATE_KEY: 0x59c6995e998f97a5a0044966f094538a2c0a3bb26a0df09c9977e7805d9b83b6d
    depends_on:
      blockchain:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
