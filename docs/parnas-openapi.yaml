          campaign:
            $ref: '#/components/schemas/CampaignSummary'
          distributedAmount:
            $ref: '#/components/schemas/TokenAmount'
          roundingRemainder:
            $ref: '#/components/schemas/TokenAmount'
          transaction:
            nullable: true
            allOf:
            - $ref: '#/components/schemas/BlockchainTransaction'
    PayoutListResponse:
      type: object
      additionalProperties: false
      required:
      - items
      - pagination
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PayoutSummary'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
    PayoutDistribution:
      type: object
      additionalProperties: false
      required:
      - payoutId
      - walletAddress
      - contributionAmount
      - sharePercent
      - payoutAmount
      - transferStatus
      properties:
        payoutId:
          type: string
          format: uuid
        walletAddress:
          $ref: '#/components/schemas/WalletAddress'
        contributionAmount:
          $ref: '#/components/schemas/TokenAmount'
        sharePercent:
          type: number
          minimum: 0
          maximum: 100
          multipleOf: 1.0e-06
        payoutAmount:
          $ref: '#/components/schemas/TokenAmount'
        transferStatus:
          type: string
          enum:
          - PENDING
          - CONFIRMED
          - FAILED
        transactionHash:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/TransactionHash'
    PayoutDistributionListResponse:
      type: object
      additionalProperties: false
      required:
      - items
      - pagination
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PayoutDistribution'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
    BlockchainTransactionListResponse:
      type: object
      additionalProperties: false
      required:
      - items
      - pagination
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BlockchainTransaction'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
    FinalizeExpiredCampaignsRequest:
      type: object
      additionalProperties: false
      properties:
        batchSize:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
        dryRun:
          type: boolean
          default: false
    FinalizeExpiredCampaignsResponse:
      type: object
      additionalProperties: false
      required:
      - jobId
      - status
      - candidatesCount
      properties:
        jobId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - QUEUED
          - RUNNING
        candidatesCount:
          type: integer
          minimum: 0
    BlockchainEventType:
      type: string
      enum:
      - CAMPAIGN_CREATED
      - CONTRIBUTION_RECEIVED
      - GOAL_REACHED
      - CAMPAIGN_FINALIZED_FAILED
      - PROFIT_DISTRIBUTED
    BlockchainEvent:
      type: object
      additionalProperties: false
      required:
      - eventId
      - type
      - chainId
      - contractAddress
      - transactionHash
      - blockNumber
      - blockHash
      - logIndex
      - payload
      properties:
        eventId:
          type: string
          description: Детерминированный ключ `chainId:blockHash:transactionHash:logIndex`.
        type:
          $ref: '#/components/schemas/BlockchainEventType'
        chainId:
          type: integer
          minimum: 1
        contractAddress:
          $ref: '#/components/schemas/WalletAddress'
        transactionHash:
          $ref: '#/components/schemas/TransactionHash'
        blockNumber:
          type: integer
          minimum: 0
        blockHash:
          type: string
          pattern: ^0x[a-fA-F0-9]{64}$
        logIndex:
          type: integer
          minimum: 0
        payload:
          type: object
          additionalProperties: true
    BlockchainEventBatch:
      type: object
      additionalProperties: false
      required:
      - events
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/BlockchainEvent'
    BlockchainEventBatchAccepted:
      type: object
      additionalProperties: false
      required:
      - accepted
      - duplicates
      - rejected
      properties:
        accepted:
          type: integer
          minimum: 0
        duplicates:
          type: integer
          minimum: 0
        rejected:
          type: integer
          minimum: 0
    FieldViolation:
      type: object
      additionalProperties: false
      required:
      - field
      - message
      properties:
        field:
          type: string
          example: targetAmountRaw
        message:
          type: string
          example: Значение должно быть положительным целым числом.
        rejectedValue: {}
    ProblemDetails:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      - code
      - detail
      - instance
      - requestId
      - timestamp
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
          description: 'Машинный код. Основные доменные значения:

            `WALLET_NOT_REGISTERED`, `WALLET_ALREADY_REGISTERED`, `USERNAME_TAKEN`, `CAMPAIGN_NOT_FOUND`, `CAMPAIGN_NOT_OPEN`,
            `CAMPAIGN_NOT_DEPLOYED`, `DEADLINE_EXPIRED`, `GOAL_ALREADY_REACHED`, `CONTRIBUTION_EXCEEDS_REMAINING_AMOUNT`,
            `INSUFFICIENT_TOKEN_BALANCE`, `INSUFFICIENT_TOKEN_ALLOWANCE`, `TRANSACTION_NOT_FOUND`, `TRANSACTION_SENDER_MISMATCH`,
            `TRANSACTION_CONTRACT_MISMATCH`, `TRANSACTION_REVERTED`, `NOT_CAMPAIGN_CREATOR`, `PAYOUT_NOT_ALLOWED`, `PAYOUT_ALREADY_EXECUTED`,
            `NO_CONFIRMED_CONTRIBUTORS`, `IDEMPOTENCY_KEY_REUSED`, `BLOCKCHAIN_UNAVAILABLE`.'
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
        violations:
          type: array
          items:
            $ref: '#/components/schemas/FieldViolation'
        retryable:
          type: boolean
          default: false
        retryAfterSeconds:
          type: integer
          minimum: 1
          nullable: true
        metadata:
          type: object
          additionalProperties: true
    HomeCampaignCard:
      type: object
      additionalProperties: false
      description: Компактная карточка кампании для главной страницы. Не содержит адрес контракта, кошелёк и персональные
        данные создателя.
      required:
      - id
      - title
      - shortDescription
      - status
      - targetAmount
      - raisedAmount
      - progressPercent
      - deadline
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 3
          maxLength: 120
          example: Экологичная мастерская
        shortDescription:
          type: string
          maxLength: 180
          example: Сбор средств на запуск мастерской переработки пластика.
        status:
          $ref: '#/components/schemas/CampaignStatus'
        targetAmount:
          $ref: '#/components/schemas/TokenAmount'
        raisedAmount:
          $ref: '#/components/schemas/TokenAmount'
        progressPercent:
          type: number
          minimum: 0
          maximum: 100
          multipleOf: 0.01
          example: 73.25
        deadline:
          type: string
          format: date-time
    CampaignListItem:
      type: object
      additionalProperties: false
      description: Элемент списка или результата поиска кампаний. Полные данные создателя и блокчейна возвращаются только
        в `GET /campaigns/{campaignId}`.
      required:
      - id
      - title
      - shortDescription
      - status
      - targetAmount
      - raisedAmount
      - progressPercent
      - createdAt
      - deadline
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 3
          maxLength: 120
        shortDescription:
          type: string
          maxLength: 300
        status:
          $ref: '#/components/schemas/CampaignStatus'
        targetAmount:
          $ref: '#/components/schemas/TokenAmount'
        raisedAmount:
          $ref: '#/components/schemas/TokenAmount'
        progressPercent:
          type: number
          minimum: 0
          maximum: 100
          multipleOf: 0.01
        createdAt:
          type: string
          format: date-time
        deadline:
          type: string
          format: date-time
  responses:
    BadRequest:
      description: Запрос синтаксически некорректен, содержит несовместимые параметры или повреждённый JSON.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://api.parnas.example/problems/bad-request
            title: Некорректный запрос
            status: 400
            code: BAD_REQUEST
            detail: Проверьте формат запроса и параметры.
            instance: /api/v1/example
            requestId: 01J2QF6S2EJ6F4B1M8XKJ0N9A7
            timestamp: '2026-07-11T12:00:00Z'
    Unauthorized:
      description: Требуется авторизация или предоставленная подпись/токен недействительны.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://api.parnas.example/problems/unauthorized
            title: Ошибка аутентификации
            status: 401
            code: UNAUTHORIZED
            detail: Не удалось подтвердить личность пользователя.
            instance: /api/v1/example
            requestId: 01J2QF6S2EJ6F4B1M8XKJ0N9A7
            timestamp: '2026-07-11T12:00:00Z'
    Forbidden:
      description: Пользователь аутентифицирован, но не имеет права выполнять операцию.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://api.parnas.example/problems/forbidden
            title: Доступ запрещён
            status: 403
            code: FORBIDDEN
            detail: Недостаточно прав для выполнения операции.
            instance: /api/v1/example
            requestId: 01J2QF6S2EJ6F4B1M8XKJ0N9A7
            timestamp: '2026-07-11T12:00:00Z'
    NotFound:
      description: Запрошенный пользователь, кампания, выплата или транзакция не найдены.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://api.parnas.example/problems/resource-not-found
            title: Ресурс не найден
            status: 404
            code: RESOURCE_NOT_FOUND
            detail: Запрошенный ресурс отсутствует или недоступен.
            instance: /api/v1/example
            requestId: 01J2QF6S2EJ6F4B1M8XKJ0N9A7
            timestamp: '2026-07-11T12:00:00Z'
    Conflict:
      description: Операция конфликтует с текущим состоянием ресурса или уже была выполнена.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://api.parnas.example/problems/state-conflict
            title: Конфликт состояния
            status: 409
            code: STATE_CONFLICT
            detail: Текущее состояние ресурса не допускает операцию.
            instance: /api/v1/example
            requestId: 01J2QF6S2EJ6F4B1M8XKJ0N9A7
            timestamp: '2026-07-11T12:00:00Z'
    Gone:
      description: Одноразовый challenge истёк или уже использован.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://api.parnas.example/problems/challenge-expired
            title: Challenge недействителен
            status: 410
            code: CHALLENGE_EXPIRED
            detail: Создайте новый challenge и подпишите его.
            instance: /api/v1/example
            requestId: 01J2QF6S2EJ6F4B1M8XKJ0N9A7
            timestamp: '2026-07-11T12:00:00Z'
    PreconditionFailed:
      description: Не выполнено условие `If-Match` либо состояние изменилось после подготовки операции.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://api.parnas.example/problems/precondition-failed
            title: Предусловие не выполнено
            status: 412
            code: PRECONDITION_FAILED
            detail: Обновите состояние ресурса и повторите операцию.
            instance: /api/v1/example
            requestId: 01J2QF6S2EJ6F4B1M8XKJ0N9A7
            timestamp: '2026-07-11T12:00:00Z'
    PayloadTooLarge:
      description: Размер тела запроса превышает установленный предел.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
