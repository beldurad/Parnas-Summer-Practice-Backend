        sharePercent:
          type: number
          minimum: 0
          maximum: 100
          multipleOf: 1.0e-06
        contributionsCount:
          type: integer
          minimum: 1
    ContributorListResponse:
      type: object
      additionalProperties: false
      required:
      - items
      - pagination
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Contributor'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
    MyContributionItem:
