      operationId: preparePayout
      summary: Подготовить транзакцию внесения и распределения профита
      description: 'Реализует UC-015. Доступно только создателю кампании, когда цель достигнута и выплата ранее не выполнялась.


        Контракт распределяет профит пропорционально сумме подтверждённых вкладов. Базовая формула: `floor(profit × contribution
        / totalRaised)`. Остаток минимальных единиц передаётся вкладчику с максимальным вкладом; при равенстве — кошельку
        с лексикографически меньшим адресом. Это обеспечивает детерминированность и распределение всей суммы.'
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CampaignId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreparePayoutRequest'
      responses:
        '201':
          description: Транзакция выплаты подготовлена.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreparedPayoutResponse'
        '400':
