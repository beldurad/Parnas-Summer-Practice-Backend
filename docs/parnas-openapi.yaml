      - createdCampaigns
      - contributions
      - aggregates
      properties:
        user:
          $ref: '#/components/schemas/UserProfile'
        createdCampaigns:
          type: array
          items:
            $ref: '#/components/schemas/CampaignSummary'
        contributions:
          type: array
          items:
            $ref: '#/components/schemas/MyContributionItem'
        aggregates:
          type: object
